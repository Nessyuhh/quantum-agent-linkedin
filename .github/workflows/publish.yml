name: Publication LinkedIn
on:
  schedule:
    # Mardi, mercredi, jeudi : les trois jours ou l'audience professionnelle est
    # la plus active. 8h45 Paris en ete, 7h45 en hiver, soit juste avant le pic
    # de 9h. Les 90 premieres minutes decident de la diffusion.
    - cron: "45 6 * * 2,3,4"
  workflow_dispatch:
    inputs:
      repetition:
        description: "Repetition generale : verifie le jeton et le visuel sans publier"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Installer Chromium
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Publier
        working-directory: scripts
        env:
          DRY_RUN: ${{ inputs.repetition && '1' || '' }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          LINKEDIN_ORG_URN: ${{ secrets.LINKEDIN_ORG_URN }}
          LINKEDIN_ORG_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ORG_ACCESS_TOKEN }}
          CIBLE_PUBLICATION: ${{ vars.CIBLE_PUBLICATION }}
          LINKEDIN_VERSION: ${{ vars.LINKEDIN_VERSION || '202608' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python publish.py
      - name: Enregistrer la file
        if: always()
        run: |
          git config user.name "agent-linkedin"
          git config user.email "agent@quantum-agency.fr"
          git add content/queue.json
          git diff --staged --quiet || git commit -m "publication: file mise a jour"
          git pull --rebase --autostash || true
          git push || true
