name: Redaction quotidienne
on:
  schedule:
    # Tous les matins : la soumission est un filet continu, pas une fournee.
    # generate.py s'arrete de lui-meme quand le stock valide suffit.
    - cron: "0 5 * * *"      # 7h00 Paris en ete, 6h00 en hiver
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rediger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Installer Chromium
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Veille de derniere minute
        working-directory: scripts
        run: python veille.py
      - name: Rediger
        working-directory: scripts
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_MODEL: ${{ vars.GOOGLE_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POSTS_PER_RUN: ${{ vars.POSTS_PER_RUN || '1' }}
          STOCK_CIBLE: ${{ vars.STOCK_CIBLE || '4' }}
        run: python generate.py
      - name: Enregistrer la file
        run: |
          git config user.name "agent-linkedin"
          git config user.email "agent@quantum-agency.fr"
          git add content/queue.json
          git diff --staged --quiet || git commit -m "redaction: nouvelle fournee"
          git pull --rebase --autostash || true
          git push
