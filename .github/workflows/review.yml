name: Releve des validations Telegram
on:
  schedule:
    # Toutes les 20 minutes de 8h a 22h40 (heure de Paris en ete).
    # Un clic dans Telegram trouve donc une reponse dans le quart d'heure.
    - cron: "*/20 6-20 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: releve-telegram
  cancel-in-progress: false
jobs:
  relever:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Chromium n'est utile que si Younes demande une reecriture : le visuel
      # est alors refait. On le garde en cache pour ne pas le retelecharger a
      # chaque passage, ce qui tiendrait le quota gratuit en otage.
      - name: Chromium en cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-v1
      - run: python -m playwright install chromium
      - name: Relever
        working-directory: scripts
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_MODEL: ${{ vars.GOOGLE_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python review.py
      - name: Enregistrer la file
        run: |
          git config user.name "agent-linkedin"
          git config user.email "agent@quantum-agency.fr"
          git add content/queue.json
          git diff --staged --quiet || git commit -m "validation: mise a jour de la file"
          git pull --rebase --autostash || true
          git push
