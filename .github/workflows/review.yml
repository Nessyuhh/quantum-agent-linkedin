name: Releve des validations Telegram
on:
  schedule:
    # Make tient desormais cette horloge : toutes les 30 minutes de 8h00 a
    # 19h30, heure de Paris, changement d'heure compris. Le planificateur de
    # GitHub, lui, ne tenait pas le rythme demande : le 26 septembre, un
    # "*/30 6-19" a produit quatre relevees dans la journee, a 12h52, 16h52,
    # 20h21 et 23h22. Une validation envoyee depuis Telegram pouvait donc
    # dormir trois ou quatre heures avant d'etre prise en compte.
    # Ce cron ne reste que comme filet, trois fois par jour, au cas ou Make
    # tombe. La relevee est idempotente : elle repart du dernier message
    # Telegram traite, donc deux horloges ne se marchent pas dessus.
    - cron: "17 6,11,16 * * *"
  workflow_dispatch:
    inputs:
      update:
        description: "Mise a jour Telegram transmise par Make, en JSON. Vide = relevee classique."
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: releve-telegram
  cancel-in-progress: false
jobs:
  relever:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Chromium n'est utile que si Younes demande une reecriture : le visuel
      # est alors refait. On le garde en cache pour ne pas le retelecharger a
      # chaque passage, ce qui tiendrait le quota gratuit en otage.
      - name: Chromium en cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-v1
      - run: python -m playwright install chromium
      - name: Relever
        working-directory: scripts
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_MODEL: ${{ vars.GOOGLE_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_UPDATE: ${{ inputs.update }}
        run: python review.py
      - name: Enregistrer la file
        run: |
          git config user.name "agent-linkedin"
          git config user.email "agent@quantum-agency.fr"
          git add content/queue.json
          git diff --staged --quiet || git commit -m "validation: mise a jour de la file"
          git pull --rebase --autostash || true
          git push
