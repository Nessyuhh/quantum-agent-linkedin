<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Big+Shoulders+Display:wght@600;700;800&family=Space+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="_base.css">
<style>
body{background:var(--panneau);color:var(--clair)}
.rail .filet{background:rgba(196,181,253,.3)} .rail .mention{color:var(--clair-64)}
.wordmark .q{color:var(--clair)} .wordmark .c{color:var(--clair-64)}
.phrase{font-family:'Big Shoulders Display','Arial Narrow',sans-serif;font-weight:700;
  text-transform:uppercase;font-size:1em;line-height:1.04;letter-spacing:-.005em}
.soulignement{height:.03em;min-height:3px;width:2.2em;background:var(--grad-clair);
  margin-top:.34em}
</style></head>
<body><div class="board">
  <div class="rail"><div class="filet"></div><div class="mention">CONSEIL &amp; FORMATION IA · PARIS</div></div>
  <div class="col">
    <div class="head"><div></div><svg viewBox="0 0 100 100" width="44" height="44" aria-hidden="true"><defs><linearGradient id="q" gradientUnits="userSpaceOnUse" x1="14" y1="14" x2="86" y2="86"><stop offset="0%" stop-color="#DDD6FE"/><stop offset="50%" stop-color="#A855F7"/><stop offset="100%" stop-color="#22D3EE"/></linearGradient></defs><path d="M 68 81.2 A 36 36 0 1 1 81.2 68" stroke="url(#q)" stroke-width="6" stroke-linecap="round" fill="none"/><line x1="60" y1="62" x2="88" y2="88" stroke="url(#q)" stroke-width="6" stroke-linecap="round"/></svg></div>
    <div class="zone" data-fit-zone>
      <div class="scale" data-fit data-fit-min="34" data-fit-max="180">
        <div class="phrase">{{PHRASE}}</div>
        <div class="soulignement"></div>
      </div>
    </div>
    <div class="foot">
      <div class="wordmark"><div class="q">QUANTUM</div><div class="c">CONSULTING</div></div>
    </div>
  </div>
</div><script src="_fit.js"></script></body></html>
