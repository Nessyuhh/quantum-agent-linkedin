<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Big+Shoulders+Display:wght@600;700;800&family=Space+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="_base.css">
<style>
/* E : deux mesures qui se repondent. L'ecart se lit d'un coup d'oeil. */
.titre{font-family:'Big Shoulders Display','Arial Narrow',sans-serif;font-weight:700;
  text-transform:uppercase;font-size:.40em;line-height:1.06;margin-bottom:.34em}
/* Une grille, pour que les deux mesures soient rigoureusement alignées :
   etiquettes sur la meme ligne, chiffres sur la meme ligne, unites en bas. */
.duo{display:grid;grid-template-columns:1fr 1px 1fr;column-gap:.34em;
  grid-template-rows:auto auto auto;align-items:end}
.separateur{grid-column:2;grid-row:1 / span 3;background:var(--trait-fort);
  width:1px;align-self:stretch}
.label{font-family:'Space Mono',monospace;font-size:.12em;letter-spacing:.2em;
  color:var(--texte-64);align-self:end;padding-bottom:.6em}
.nombre{font-family:'Big Shoulders Display','Arial Narrow',sans-serif;font-weight:800;
  font-size:1.94em;line-height:.84;letter-spacing:-.012em;white-space:nowrap}
.unite{font-family:'Archivo',system-ui,sans-serif;font-weight:500;font-size:.155em;
  line-height:1.3;margin-top:.55em;color:var(--texte-64);align-self:start}
.g{grid-column:1} .d{grid-column:3}
.d.label{color:var(--accent)} .d.unite{color:var(--texte)}
.note{font-family:'Archivo',system-ui,sans-serif;font-weight:400;font-size:.185em;
  line-height:1.34;margin-top:.40em;padding-top:.24em;border-top:1px solid var(--trait)}
</style></head>
<body class="{{THEME}}"><div class="board">
  <div class="rail"><div class="filet"></div><div class="mention">CONSEIL &amp; FORMATION IA · PARIS</div></div>
  <div class="col">
    <div class="head"><div></div><svg viewBox="0 0 100 100" width="44" height="44" aria-hidden="true"><defs><linearGradient id="q" gradientUnits="userSpaceOnUse" x1="14" y1="14" x2="86" y2="86"><stop class="a" offset="0%"/><stop class="b" offset="50%"/><stop class="c" offset="100%"/></linearGradient></defs><path d="M 68 81.2 A 36 36 0 1 1 81.2 68" stroke="url(#q)" stroke-width="6" stroke-linecap="round" fill="none"/><line x1="60" y1="62" x2="88" y2="88" stroke="url(#q)" stroke-width="6" stroke-linecap="round"/></svg></div>
    <div class="zone" data-fit-zone>
      <div class="scale" data-fit data-fit-min="34" data-fit-max="190">
        <div class="titre">{{TITLE}}</div>
        <div class="duo">
          <div class="g label">{{LEFT_LABEL}}</div>
          <div class="separateur"></div>
          <div class="d label">{{RIGHT_LABEL}}</div>
          <div class="g nombre">{{LEFT_NUMBER}}</div>
          <div class="d nombre grad-text">{{RIGHT_NUMBER}}</div>
          <div class="g unite">{{LEFT_UNIT}}</div>
          <div class="d unite">{{RIGHT_UNIT}}</div>
        </div>
        <div class="note">{{NOTE}}</div>
      </div>
    </div>
    <div class="foot">
      <div class="wordmark"><div class="q">QUANTUM</div><div class="c">CONSULTING</div></div>
    </div>
  </div>
</div><script src="_fit.js"></script></body></html>
